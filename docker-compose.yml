services:
  invman:
    build: .
    container_name: invman
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-in-production-min-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@invman.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEFAULT_EXCHANGE_RATE: ${DEFAULT_EXCHANGE_RATE:-1.0}
    volumes:
      - invman-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - web
    depends_on:
      - invman

volumes:
  invman-data:
  caddy-data:
  caddy-config:

networks:
  web:
    driver: bridge
